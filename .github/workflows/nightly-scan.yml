name: Nightly Job Hunt

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project dependencies
        run: pip install -e .

      - name: Rebuild config + resume from secrets
        run: |
          mkdir -p resume

          cat > config.json <<'EOF'
          ${{ secrets.JOBHUNT_CONFIG_JSON }}
          EOF

          cat > resume/resume.md <<'EOF'
          ${{ secrets.JOBHUNT_RESUME_MD }}
          EOF

          echo "Validating config.json..."
          python -m json.tool config.json > /dev/null && echo "config.json OK"

      - name: Run scan
        env:
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: autopilot scan

      - name: Persist scan state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add state/
          git commit -m "chore: update scan state [skip ci]" || echo "nothing to commit"
          git push
